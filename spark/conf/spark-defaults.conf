spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.my_catalog=org.apache.iceberg.spark.SparkCatalog

spark.sql.catalog.my_catalog.catalog-impl=org.apache.iceberg.jdbc.JdbcCatalog

spark.sql.catalog.my_catalog.uri=jdbc:postgresql://postgres:5432/iceberg

spark.sql.catalog.my_catalog.jdbc.user=iceberg
spark.sql.catalog.my_catalog.jdbc.password=iceberg

spark.sql.catalog.my_catalog.warehouse=s3a://warehouse/


# MinIO / S3A

spark.hadoop.fs.s3a.endpoint=http://minio:9000

spark.hadoop.fs.s3a.access.key=minio

spark.hadoop.fs.s3a.secret.key=minio123

spark.hadoop.fs.s3a.path.style.access=true

spark.hadoop.fs.s3a.connection.ssl.enabled=false

spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem