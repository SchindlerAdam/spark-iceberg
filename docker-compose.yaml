services:

  postgres:
    image: postgres:18.6
    container_name: iceberg-postgres
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: pgsty/minio:latest
    container_name: iceberg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: iceberg-spark
    depends_on:
      - postgres
      - minio
    ports:
      - "4040:4040"
    volumes:
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres-data:
  minio-data: